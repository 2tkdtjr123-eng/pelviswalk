name: engine-test
on: [push, pull_request]
jobs: {test: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {uses: actions/setup-node@v4, with: {node-version: 20}}, {name: synthetic gait accuracy, run: 'node -e "const G=require(''./gait-core.js'');let ok=true;for(const o of [{seed:7},{seed:11},{seed:3,stepR:0.48,stepL:0.62}]){const r=G.analyze(G.synth(o),{age:30,height:170});console.log(JSON.stringify(o),r.ok,r.general&&r.general.steps,r.general&&r.general.speed.toFixed(2));if(!r.ok||Math.abs(r.general.steps-16)>1)ok=false}process.exit(ok?0:1)"'}]}}
